name: gh-runners-dgx

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: gh-runner-dgx:local
    platform: linux/arm64
    # Replica count is driven by scripts/autoscale.sh between RUNNER_MIN and
    # RUNNER_MAX. This is only the value used on a cold `docker compose up -d`.
    deploy:
      replicas: ${RUNNER_REPLICAS:-4}
      resources:
        limits:
          cpus: "${RUNNER_CPUS:-4}"
          memory: ${RUNNER_MEMORY:-8g}
    restart: always
    # Required for the in-container dockerd (cgroups, overlay2, iptables).
    privileged: true
    environment:
      GH_OWNER: ${GH_OWNER:-}
      GH_REPO: ${GH_REPO:-}
      GH_APP_ID: ${GH_APP_ID:-}
      # Linux host: mount the .pem and point at it (below). The base64 variant
      # exists only for macOS/OrbStack, where bind-mounting the key hangs the
      # container. Set one or the other, not both — B64 wins if both are set.
      GH_APP_PRIVATE_KEY: ${GH_APP_PRIVATE_KEY:-/run/secrets/app-key.pem}
      GH_APP_PRIVATE_KEY_B64: ${GH_APP_PRIVATE_KEY_B64:-}
      GH_TOKEN: ${GH_TOKEN:-}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      RUNNER_GROUP: ${RUNNER_GROUP:-dgx-spark}
      # NOTE: this is a PREFIX, not a name. entrypoint.sh appends the container
      # id, so every runner gets a unique name. Do NOT pin full names like
      # "dgx-spark-3" — that is why a dead runner never came back.
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-dgx-spark}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,Linux,ARM64,dgx-spark,docker}
      RUNNER_EPHEMERAL: ${RUNNER_EPHEMERAL:-true}
      RUNNER_ENABLE_DIND: ${RUNNER_ENABLE_DIND:-true}
      DIND_SELFTEST: ${DIND_SELFTEST:-false}
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: ${RUNNER_DEBUG_LOGS:-}
      # Warm caches on volumes shared by every replica (T63). The runner hands
      # these to every job. RUNNER_TOOL_CACHE is where actions/setup-go (and
      # setup-node) look before downloading a toolchain; scripts/warm-go.sh
      # pre-extracts the Go versions in use there. Go's module and build caches
      # are safe for concurrent use; -modcacherw keeps the shared module cache
      # writable across containers (Go marks it read-only by default).
      RUNNER_TOOL_CACHE: /home/runner/toolcache
      GOMODCACHE: /home/runner/gocache/mod
      GOCACHE: /home/runner/gocache/build
      GOFLAGS: ${GOFLAGS:--modcacherw}
    volumes:
      # ANONYMOUS volume — each replica gets its OWN /var/lib/docker. A named
      # volume here would be shared by every replica and corrupt itself.
      # It must be a volume at all: overlay2 cannot stack on the container's
      # own overlayfs.
      - /var/lib/docker
      # GitHub App key, read-only; keep the host file mode 600. dind-entrypoint.sh
      # copies it for uid 1001 as root and then UNMOUNTS it inside the container;
      # entrypoint.sh deletes the copy right after registration (core-v2#1503),
      # so a job step never sees a key. Docker mounts it again on every restart.
      - ${GH_APP_KEY_PATH:-./secrets/app-key.pem}:/run/secrets/app-key.pem:ro
      # Shared, NAMED volumes (unlike /var/lib/docker above): one toolchain and
      # one Go cache for the whole pool. dind-entrypoint.sh chowns the mount
      # points to uid 1001 at start, since docker creates them as root.
      - toolcache:/home/runner/toolcache
      - gocache:/home/runner/gocache
      # Uncomment for GPU workflows (needs nvidia-container-toolkit on the host).
      # Note this shares the host GPU across every replica.
      # - /dev/nvidia0:/dev/nvidia0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  toolcache:
  gocache:
